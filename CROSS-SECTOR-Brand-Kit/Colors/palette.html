<!DOCTYPE html><html><head><meta charset="utf-8"><title>CROSS-SECTOR — Colors</title><style>
body{margin:0;font-family:Arial,sans-serif;background:#E9E8E2}
.sw{display:flex;align-items:center;gap:24px;padding:20px 32px;border-bottom:1px solid rgba(0,0,0,.1)}
.chip{width:64px;height:64px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.1)}
.name{font-weight:bold;font-size:14px}.hex{font-family:monospace;color:#555}
</style></head><body>
<div class="sw"><div class="chip" style="background:#0B0E11"></div><div><div class="name">Ground</div><div class="hex">#0B0E11</div></div></div>
<div class="sw"><div class="chip" style="background:#14171C"></div><div><div class="name">Ink</div><div class="hex">#14171C</div></div></div>
<div class="sw"><div class="chip" style="background:#E9E8E2"></div><div><div class="name">Bone</div><div class="hex">#E9E8E2</div></div></div>
<div class="sw"><div class="chip" style="background:#E5E4DE"></div><div><div class="name">Stone</div><div class="hex">#E5E4DE</div></div></div>
<div class="sw"><div class="chip" style="background:#DCDAD2"></div><div><div class="name">Stone 2</div><div class="hex">#DCDAD2</div></div></div>
<div class="sw"><div class="chip" style="background:#1F5C46"></div><div><div class="name">Accent (Green Deep)</div><div class="hex">#1F5C46</div></div></div>
<div class="sw"><div class="chip" style="background:#8FCBA9"></div><div><div class="name">Accent Light</div><div class="hex">#8FCBA9</div></div></div>
<div class="sw"><div class="chip" style="background:#5C5F58"></div><div><div class="name">Ink Soft</div><div class="hex">#5C5F58</div></div></div>
</body></html>
